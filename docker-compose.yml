# AI-Avatar — local dev stack for the 001-initial-poc feature.
# Constitutional Deployment table: backend on eclipse-temurin, frontend on nginx.
# Volume `aiavatar-db` is declared for forward-compat with future persistence
# features; it is intentionally NOT mounted in this POC (FR-016 / FR-020).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-avatar/backend:dev
    container_name: ai-avatar-backend
    ports:
      - "8080:8080"
    # Load secrets (Gemini key, Gmail SMTP creds) straight from backend/.env.
    # Values here are overridden by anything explicitly set in `environment:`.
    env_file:
      - ./backend/.env
    environment:
      # Activate the Gemini image+text provider by default (the .env supplies
      # the key). Override to `default` for offline/stub-only, or `falai` to
      # use fal.ai instead. Setting a key alone does NOT flip the profile.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-gemini}
      SERVER_PORT: 8080
      # Outbound email (023/027) — pulled from ./backend/.env so the "email me
      # my poster" button works. Blank values keep email on the graceful
      # "not configured" path instead of erroring.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      AIAVATAR_EMAIL_FROM: ${AIAVATAR_EMAIL_FROM:-}
      # Gemini text model override (the .env pins a key-compatible model).
      GEMINI_TEXT_MODEL_ID: ${GEMINI_TEXT_MODEL_ID:-gemini-2.5-flash}
      # 003 Gemini image-generator envs — backend-only (FR-211: frontend MUST
      # NOT receive the key). Defaults mirror application.yml's so an unset
      # host variable never resolves to an empty string (which would then
      # fail to bind to primitives like request-timeout-ms:int).
      # A blank GEMINI_API_KEY keeps the image generator on the fallback
      # path per FR-212.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-gemini-3.1-flash-image-preview}
      GEMINI_ENDPOINT_URL: ${GEMINI_ENDPOINT_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_REQUEST_TIMEOUT_MS: ${GEMINI_REQUEST_TIMEOUT_MS:-25000}
      # 016 fal.ai image-generator envs — backend-only (FR-1611: frontend MUST
      # NOT receive the key). Defaults mirror application.yml so an unset host
      # variable never resolves to an empty string and trips primitive binding.
      # Blank FAL_AI_API_KEY keeps the image generator on the fallback path
      # per FR-1604 (only meaningful when SPRING_PROFILES_ACTIVE=falai).
      FAL_AI_API_KEY: ${FAL_AI_API_KEY:-}
      FAL_AI_MODEL_ID: ${FAL_AI_MODEL_ID:-fal-ai/nano-banana-pro/edit}
      FAL_AI_ENDPOINT_URL: ${FAL_AI_ENDPOINT_URL:-https://queue.fal.run}
      FAL_AI_END_TO_END_TIMEOUT_MS: ${FAL_AI_END_TO_END_TIMEOUT_MS:-30000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-avatar/frontend:dev
    container_name: ai-avatar-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aiavatar-db:
    name: aiavatar-db
