# Frontend Nginx config — serves the Vite production bundle and proxies
# /api/** to the backend service. Same-origin from the browser's POV (S3).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy (Docker Compose service `backend` on port 8080).
    # Timeouts are sized around the slowest provider path: fal.ai's
    # `nano-banana-pro/edit` averages 30–60 s and the spec FR-1614a allows
    # the backend to spend up to 30 s end-to-end (configurable to 90 s for
    # local testing). proxy_read_timeout MUST exceed that envelope or
    # nginx 504s the upstream while the backend is still legitimately
    # waiting on fal.ai's queue, and the browser-side resilient client
    # falls back to the local SVG poster — confusingly without ever
    # surfacing the real provider response.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 003 raised the backend multipart limit to 20 MB. nginx must permit
        # at least that plus a margin for multipart boundaries / headers.
        client_max_body_size 22M;
        # Enough to cover the 90 s configurable end-to-end fal.ai budget
        # plus a small margin for the rest of the request lifecycle.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Static asset cache — long for fingerprinted Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
